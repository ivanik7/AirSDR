# SPDX-License-Identifier: GPL-3.0-or-later
#
# AirSDR CI: tests, Android APKs and Linux packages. See docs/ci.md.
# Native code (libsdrcore and the vendored libusb, rtl-sdr, hackrf,
# liquid-dsp, rtl_433, redsea, ...) is always built from the sources in this
# repository; no prebuilt SDR libraries are downloaded.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  # flutter.ndkVersion of Flutter 3.47.5; also pinned for mp_audio_stream in
  # android/build.gradle.kts.
  ANDROID_NDK_VERSION: "28.2.13676358"
  # android/app/build.gradle.kts externalNativeBuild.cmake.version.
  ANDROID_CMAKE_VERSION: "3.22.1"
  NFPM_VERSION: "2.48.0"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - run: flutter pub get

      - run: flutter analyze

      # Host libsdrcore.so from source + the CMake-wired native suite and
      # standalone native regressions. Tests that need a real RTL-SDR print
      # a skip line when no device is attached.
      - name: Native host tests
        run: native/tests/run_host_tests.sh build/native-host-tests

      # Dart tests, including FFI tests against the host library built above.
      # Hardware tests stay skipped: SDR_HW_TEST is not set.
      - name: Flutter tests
        env:
          SDRCORE_HOST_LIBRARY: ${{ github.workspace }}/build/native-host-tests/libsdrcore.so
        run: flutter test

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: tool/version.sh counts commits for the versionCode.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runner image ships an Android SDK with cmdline-tools at
      # $ANDROID_HOME; only the pinned packages below are added to it.
      - name: Locate Android SDK
        id: sdk
        run: |
          test -n "$ANDROID_HOME"
          echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Cache Android NDK and CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.home }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ steps.sdk.outputs.home }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "$ANDROID_PLATFORM" \
            "$ANDROID_BUILD_TOOLS" \
            "platform-tools" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION" > /dev/null
          sdkmanager --list_installed | grep -E "ndk|cmake|build-tools|platforms;android-36"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - run: flutter pub get

      - name: Build release APK (arm64)
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-name "${{ steps.ver.outputs.FULL_VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --build-name "${{ steps.ver.outputs.FULL_VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      - name: Rename APKs
        id: apk
        run: |
          out=build/app/outputs/flutter-apk
          release="AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-arm64-release.apk"
          debug="AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-debug.apk"
          mv "$out/app-release.apk" "$out/$release"
          mv "$out/app-debug.apk" "$out/$debug"
          ls -l "$out"
          echo "release=$out/$release" >> "$GITHUB_OUTPUT"
          echo "debug=$out/$debug" >> "$GITHUB_OUTPUT"

      # archive: false uploads the APK itself; the artifact name is the file name.
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.release }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.debug }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: tool/version.sh counts commits for the package version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev
          curl -fsSLo /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb
          nfpm --version

      - run: flutter pub get

      - name: Build Linux bundle
        run: >-
          flutter build linux --release
          --build-name "${{ steps.ver.outputs.VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      - name: Check bundled libraries resolve
        run: |
          bundle=build/linux/x64/release/bundle
          ldd "$bundle/sdr_flutter" "$bundle"/lib/*.so | tee /tmp/ldd.txt
          ! grep -q "not found" /tmp/ldd.txt

      - name: Build packages
        run: packaging/linux/build-packages.sh build/linux/x64/release/bundle dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Installs the packages on clean distributions with their own package
  # managers, so missing or misnamed dependencies fail here, not on a user's
  # machine.
  linux-install:
    name: Install on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Sy --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AirSDR-*-linux-x86_64
          path: dist
          merge-multiple: true

      - name: Install package
        run: ${{ matrix.install }}

      - name: Check installed files and libraries
        run: |
          test -x /usr/bin/airsdr
          test -f /usr/lib/udev/rules.d/60-airsdr.rules
          test -f /usr/share/applications/net.ivanik.sdr_flutter.desktop
          ldd /opt/airsdr/sdr_flutter /opt/airsdr/lib/*.so | tee /tmp/ldd.txt
          ! grep -q "not found" /tmp/ldd.txt

  # Tag pushes (v*) publish every artifact as a GitHub release.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, android, linux, linux-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails unless the tag matches version: in pubspec.yaml.
      - name: Check tag against pubspec.yaml
        run: tool/version.sh | grep -x RELEASE=true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "AirSDR $GITHUB_REF_NAME" --generate-notes
