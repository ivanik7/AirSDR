# SPDX-License-Identifier: GPL-3.0-or-later
#
# AirSDR CI: tests, Android APKs and Linux packages. See docs/ci.md.
# Native code (libsdrcore and the vendored libusb, rtl-sdr, hackrf,
# liquid-dsp, rtl_433, redsea, ...) is always built from the sources in this
# repository; no prebuilt SDR libraries are downloaded.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  # flutter.ndkVersion of Flutter 3.47.5; also pinned for mp_audio_stream in
  # android/build.gradle.kts.
  ANDROID_NDK_VERSION: "28.2.13676358"
  # android/app/build.gradle.kts externalNativeBuild.cmake.version.
  ANDROID_CMAKE_VERSION: "3.22.1"
  NFPM_VERSION: "2.48.0"
  # llvm-mingw release used to cross-build sdrcore.dll (MSVC cannot build it).
  LLVM_MINGW_VERSION: "20261006"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev ffmpeg

      - run: flutter pub get

      - run: flutter analyze

      - name: Release workflow regressions
        run: python3 -m unittest discover -s test/ci -p '*_test.py'

      # Host libsdrcore.so from source + the CMake-wired native suite and
      # standalone native regressions. Tests that need a real RTL-SDR print
      # a skip line when no device is attached.
      - name: Native host tests
        run: native/tests/run_host_tests.sh build/native-host-tests

      # Dart tests, including FFI tests against the host library built above.
      # Hardware tests stay skipped: SDR_HW_TEST is not set.
      - name: Flutter tests
        env:
          SDRCORE_HOST_LIBRARY: ${{ github.workspace }}/build/native-host-tests/libsdrcore.so
        run: flutter test

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: tool/version.sh counts commits for the versionCode.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runner image ships an Android SDK with cmdline-tools at
      # $ANDROID_HOME; only the pinned packages below are added to it.
      - name: Locate Android SDK
        id: sdk
        run: |
          test -n "$ANDROID_HOME"
          echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Cache Android NDK and CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.home }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ steps.sdk.outputs.home }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "$ANDROID_PLATFORM" \
            "$ANDROID_BUILD_TOOLS" \
            "platform-tools" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION" > /dev/null
          sdkmanager --list_installed | grep -E "ndk|cmake|build-tools|platforms;android-36"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - run: flutter pub get

      # Secrets are absent on pull requests from forks; the release APK is
      # then signed with the debug key (android/app/build.gradle.kts).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; release APK uses the debug key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/airsdr-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # One APK per ABI. force-version-code-ignoring-abi keeps versionCode
      # equal to BUILD_NUMBER instead of adding Flutter's 1000 * ABI offset.
      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
          --build-name "${{ steps.ver.outputs.FULL_VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"
          -P force-version-code-ignoring-abi=true

      - name: Check and rename APKs
        id: apk
        run: |
          out=build/app/outputs/flutter-apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$out/app-$abi-release.apk"
            unzip -l "$src" | grep -q "lib/$abi/libsdrcore.so"
            "$apksigner" verify --print-certs "$src" | grep -E "DN|SHA-256"
            dst="$out/AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-android-$abi.apk"
            mv "$src" "$dst"
            echo "${abi//-/_}=$dst" >> "$GITHUB_OUTPUT"
          done
          ls -l "$out"

      # archive: false uploads the APK itself; the artifact name is the file name.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.arm64_v8a }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.armeabi_v7a }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x86_64 }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: tool/version.sh counts commits for the package version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev
          curl -fsSLo /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb
          nfpm --version

      - run: flutter pub get

      - name: Build Linux bundle
        run: >-
          flutter build linux --release
          --build-name "${{ steps.ver.outputs.VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      - name: Check bundled libraries resolve
        run: |
          bundle=build/linux/x64/release/bundle
          # Plugin RUNPATH points to the build tree; ldd on the plugin alone
          # needs the executable's $ORIGIN/lib search path explicitly.
          export LD_LIBRARY_PATH="$PWD/$bundle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$bundle/sdr_flutter" "$bundle"/lib/*.so | tee /tmp/ldd.txt
          ! grep -q "not found" /tmp/ldd.txt

      - name: Build packages
        run: packaging/linux/build-packages.sh build/linux/x64/release/bundle dist

      - name: Upload Debian / Ubuntu package
        uses: actions/upload-artifact@v7
        with:
          name: AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-linux-x86_64-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fedora / openSUSE package
        uses: actions/upload-artifact@v7
        with:
          name: AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-linux-x86_64-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-linux-x86_64-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-linux-x86_64-tar
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Installs the packages on clean distributions with their own package
  # managers, so missing or misnamed dependencies fail here, not on a user's
  # machine.
  linux-install:
    name: Install on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Sy --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AirSDR-*-linux-x86_64-*
          path: dist
          merge-multiple: true

      - name: Install package
        run: ${{ matrix.install }}

      - name: Check installed files and libraries
        run: |
          test -x /usr/bin/airsdr
          test -f /usr/lib/udev/rules.d/60-airsdr.rules
          test -f /usr/share/applications/net.ivanik.sdr_flutter.desktop
          export LD_LIBRARY_PATH="/opt/airsdr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd /opt/airsdr/sdr_flutter /opt/airsdr/lib/*.so | tee /tmp/ldd.txt
          ! grep -q "not found" /tmp/ldd.txt

  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      # Universal libsdrcore.dylib from source (docs/desktop-build.md); the
      # deployment target matches macos/Runner.xcodeproj.
      - name: Build libsdrcore.dylib
        run: |
          cmake -S native -B build/native-macos -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/native-macos --target sdrcore -j "$(sysctl -n hw.ncpu)"
          lipo -info build/native-macos/libsdrcore.dylib

      - run: flutter pub get

      - name: Folder picker and bookmark adapter tests
        run: flutter test test/platform/record_folder_test.dart test/platform/mac_record_folder_test.dart

      - name: Build app
        run: >-
          flutter build macos --release
          --build-name "${{ steps.ver.outputs.VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      # Dart loads Contents/Frameworks/libsdrcore.dylib. The app is only
      # ad-hoc signed and not notarized: Gatekeeper asks the user to confirm
      # the first launch (System Settings > Privacy & Security > Open Anyway).
      - name: Desktop icon and DMG staging regressions
        run: python3 test/ci/desktop_assets_test.py

      - name: Bundle libsdrcore and package a disk image
        id: dmg
        run: |
          app=build/macos/Build/Products/Release/AirSDR.app
          mkdir -p "$app/Contents/Frameworks"
          cp build/native-macos/libsdrcore.dylib "$app/Contents/Frameworks/"
          codesign --force --sign - "$app/Contents/Frameworks/libsdrcore.dylib"
          codesign --force --sign - \
            --preserve-metadata=entitlements,requirements,flags,runtime "$app"
          codesign --verify --deep --strict "$app"
          dmg="AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-macos.dmg"
          stage="$(mktemp -d "$RUNNER_TEMP/airsdr-dmg.XXXXXX")"
          packaging/macos/stage-dmg.sh "$app" "$stage"
          hdiutil create -volname AirSDR -srcfolder "$stage" -ov -format UDZO "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dmg.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # sdrcore.dll needs llvm-mingw (liquid-dsp uses C99 _Complex, which MSVC
  # lacks), so it is cross-built here, as in docs/desktop-build.md, and the
  # MSVC Flutter runner in the windows job picks it up.
  windows-native:
    name: Windows sdrcore.dll
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install llvm-mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build sdrcore.dll
        run: |
          cmake -S native -B build/native-windows -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/native/cmake/llvm-mingw-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-windows --target sdrcore
          dll="$(find build/native-windows -name sdrcore.dll -print -quit)"
          test -n "$dll"
          mkdir -p dist && cp "$dll" dist/
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p dist/sdrcore.dll | grep "DLL Name" || true

      - name: Upload sdrcore.dll
        uses: actions/upload-artifact@v7
        with:
          name: sdrcore-windows-x86_64
          path: dist/sdrcore.dll
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows app
    needs: windows-native
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: sdrcore-windows-x86_64
          path: build/sdrcore

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Folder picker adapter tests
        run: flutter test test/platform/record_folder_test.dart

      # windows/CMakeLists.txt installs $SDRCORE_DLL beside the runner.
      - name: Build app
        env:
          SDRCORE_DLL: ${{ github.workspace }}\build\sdrcore\sdrcore.dll
        run: >-
          flutter build windows --release
          --build-name "${{ steps.ver.outputs.VERSION }}"
          --build-number "${{ steps.ver.outputs.BUILD_NUMBER }}"

      # Unsigned: SmartScreen warns on first launch. RTL-SDR/HackRF need the
      # WinUSB driver (Zadig), see docs/desktop-build.md.
      - name: Package zip
        id: zip
        run: |
          out=build/windows/x64/runner/Release
          test -f "$out/sdrcore.dll"
          zip="AirSDR-${{ steps.ver.outputs.FULL_VERSION }}-windows-x86_64.zip"
          pwsh -NoProfile -Command "Compress-Archive -Path '$out/*' -DestinationPath '$zip'"
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Tag pushes (v*) publish a GitHub release; pushes to master replace the
  # "nightly" pre-release. Both carry version-free file names
  # (tool/stable-asset-names.sh) so README links point at fixed files. The
  # macOS and Windows builds are still experimental: when they fail, the
  # release goes out without them. A platform whose job succeeded must
  # provide all its files (BUILD_RESULTS), or publishing fails.
  #
  # download-artifact unpacks any artifact that is a zip, including the
  # Windows app zip uploaded with archive: false, so that one is downloaded
  # separately with skip-decompress; the APKs, the DMG and the Linux package
  # containers keep the default extraction.
  release:
    name: GitHub release
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.test.result == 'success' && needs.android.result == 'success' &&
      needs.linux-install.result == 'success'
    needs: [test, android, linux, linux-install, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails unless the tag matches version: in pubspec.yaml.
      - name: Check tag against pubspec.yaml
        run: tool/version.sh | grep -x RELEASE=true

      # The AirSDR- prefix skips the intermediate sdrcore.dll artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: "AirSDR-*-{android-*,linux-*,macos.dmg}"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: AirSDR-*-windows-x86_64.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULTS: >-
            android=${{ needs.android.result }} linux=${{ needs.linux.result }}
            macos=${{ needs.macos.result }} windows=${{ needs.windows.result }}
        run: |
          assets="$(mktemp -d "$RUNNER_TEMP/airsdr-release.XXXXXX")"
          tool/stable-asset-names.sh dist "$assets"
          gh release create "$GITHUB_REF_NAME" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" --title "AirSDR $GITHUB_REF_NAME" \
            --generate-notes --latest

  nightly:
    name: Nightly pre-release
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.test.result == 'success' &&
      (needs.android.result == 'success' || needs.linux.result == 'success' ||
       needs.macos.result == 'success' || needs.windows.result == 'success')
    needs: [test, android, linux, linux-install, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: tool/version.sh | tee -a "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: "AirSDR-*-{android-*,linux-*,macos.dmg}"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: AirSDR-*-windows-x86_64.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      # Publish available packages even when another platform build failed.
      # Recreated on every push: deleting the release and its tag, then
      # creating both at the new commit, keeps the download URLs and never
      # force-pushes a ref. --latest=false keeps releases/latest on the last
      # tagged release.
      - name: Replace nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULTS: >-
            android=${{ needs.android.result }} linux=${{ needs.linux.result }}
            macos=${{ needs.macos.result }} windows=${{ needs.windows.result }}
        run: |
          assets="$(mktemp -d "$RUNNER_TEMP/airsdr-release.XXXXXX")"
          tool/stable-asset-names.sh dist "$assets"
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly "$assets"/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "AirSDR nightly ${{ steps.ver.outputs.FULL_VERSION }}" \
            --notes "Automatic build of master at $GITHUB_SHA (${{ steps.ver.outputs.FULL_VERSION }}). Not a release: replaced on every push."
