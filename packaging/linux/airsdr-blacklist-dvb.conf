# Installed by the AirSDR package.
# The DVB-T kernel driver claims RTL2832U dongles, and the vendored rtl-sdr
# driver does not detach it, so the receiver cannot open the device while it
# is loaded. This is the same blacklist the Debian rtl-sdr package ships.
# Remove this file to use the dongle as a DVB-T TV receiver again.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
